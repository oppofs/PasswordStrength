<!DOCTYPE html>
<html>
<head>
	<title>Password</title>
<style>
#pwdchecker {
    background-color: #D73F40;
    width: 1%;
    height: 50px;
    /*border-radius: 5px;*/
    transition: 0.5s;
}
</style>
</head>
<body>

<div>
	<h1>Password Checker</h1>
	<label>Enter the password</label>
	<input type="text" name="" id="password">
	<p id="pwdchecker"></p>
</div>


<script>

let password = document.querySelector('#password');
let pStrength = document.getElementById('pwdchecker');
// let pStrength = document.querySelector('#pwdchecker');

password.oninput=()=>{
	let point = 0;
	let value = password.value;
	// console.log(value);

	let widthplus = ["1%", "20%", "50%", "75%", "100%"];
	let widthColor = ["#D73F40", "#DC6551", "#F2B84F", "#BDE952", "#3ba62f"];

	if(value.length >= 6 && value.length <= 10){
		var inputText = [ /[0-9]/, /[a-z]/, /[A-Z]/, /[^0-9a-zA-Z]/];
		inputText.forEach(function(item){
			if(item.test(value)){
				point += 1;
				// console.log(point);
			}
		});
	}
	if(value.length > 10){
		alert("passweord exceed");
	}

	pStrength.style.width = widthplus[point];
	pStrength.style.backgroundColor = widthColor[point];
	// pStrength.innerHTML =value;
	// console.log(pStrength);
}

</script>
</body>
</html>
